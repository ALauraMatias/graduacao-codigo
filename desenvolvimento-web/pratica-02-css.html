<!DOCTYPE html>
<html>
<head>
	<link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" 
    rel="stylesheet">
</head>

<body class="container">
	<h1> Calcularoda comum </h1>
    <form class="form m-2">
        <label class="form-label">Valor A</label>
        <input type="number" id="v1"/>

        <label class="form-label">Valor B</label>
        <input type="number" id="v2"/>
		
		<label class="form-label"> Operações </label>
        <select id="oper">
            <option>Soma</option>
            <option>Subtração</option>
            <option>Multiplicação</option>
            <option>Divisão</option>
            <option>Potência</option>
        </select>

        <a href="#" class="btn btn-primary m-2" onclick="executar()">Executar</a>
    </form>

    <div class="alert alert-success" id="resp">O resultado aparece aqui</div>

    <script src="Pratica01-JS.js"></script>

    <script>
        const executar = () => {
            const a = Number(document.getElementById("v1").value);
            const b = Number(document.getElementById("v2").value);
            const oper = document.getElementById("oper").selectedIndex;

            let resultado;

            if (oper === 0) {
                resultado = somar(a, b);
            } else if (oper === 1) {
                resultado = subtrair(a, b);
            } else if (oper === 2) {
                resultado = multiplicar(a, b);
            } else if (oper === 3) {
                resultado = dividir(a, b);
            } else {
                resultado = exponencial(a, b);
            }

            document.getElementById("resp").textContent =
                `O resultado da operação é ${resultado}`;
        };
    </script>
	
	<h1> Calculadora de IMC </h1>
	<form class="form m-2">
		<label>Peso (Kg)</label>
		<input type = "number" id="v3"/>
		
		<label> Altura (m) </label>
		<input type = "number" id="v4"/>
		
		<a href = "#" class="btn btn-primary m-2" onclick="calcular()"> 
			Calcular 
		</a> 
		
	</form>
	
	<script src = "Pratica02-JS.js"></script>
    <script>
        const calcular = () => {

            const peso = Number(document.getElementById("v3").value);
            const altura = Number(document.getElementById("v4").value);

            const v_imc = imc(peso, altura);
            const v_resultado = resultado(v_imc);

            alert(
                `IMC: ${v_imc.toFixed(2)} :: Resultado: ${v_resultado}`
            );
        };
    </script>
	
	<h1> Série de Fibonacci </h1>
	<form class="form m-2">
		<label> Valor de X </label> 
		<input type ="number" id ="v5"/> 
		<a href="#" class="btn btn-primary m-2" onclick="fib_exe()"> Executar </a>
	</form>
	<div class="alert alert-success" id="resp"> O resultado aparece aqui </div>
	<script src="Pratica03-JS.js"></script>
	<script>
		const fib_exe = () => {
			cont x = evel(document.getElementById("v5").value);
			let serie = "", i=0;
			while (i<=x){serie += fibonacci(i) + ""; i++;}
			document.getElementById("resp".innetHTML = 'Resultado:$(serie)';
		}
	</script>
	<!-- <div class="alert alert-success" id="resp">O resultado aparece aqui</div>-->
</body>
</html>
